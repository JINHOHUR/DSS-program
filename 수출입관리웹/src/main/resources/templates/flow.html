<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('업무 플로우')}"></head>
<body>
<div class="app">
  <aside th:replace="~{layout :: sidebar}"></aside>
  <div class="main">
    <header th:replace="~{layout :: topbar('업무 플로우')}"></header>
    <main class="content flow-page">
      <p class="sub">박스를 끌어 자유롭게 배치하고, [연결 그리기]로 화살표를 이으세요. 항목을 클릭하면 오른쪽에 관련 자료가 나옵니다.</p>

      <div class="toolbar">
        <button class="btn primary" id="fAdd">＋ 항목 추가</button>
        <button class="btn" id="fEdit">수정</button>
        <button class="btn danger" id="fDel">삭제</button>
        <span class="vsep"></span>
        <button class="btn" id="fConn">🔗 연결 그리기</button>
        <button class="btn" id="fAuto">자동 정렬</button>
        <button class="btn" id="fReset">기본값 복원</button>
        <span id="fHint" class="hint-blue"></span>
        <span class="spacer"></span>
        <button class="btn" id="fFit">🔍 화면에 맞추기</button>
        <button class="btn" id="fZoomOut">－</button>
        <span id="fZoom" class="mono">100%</span>
        <button class="btn" id="fZoomIn">＋</button>
        <button class="btn" id="fDetail">상세 숨기기</button>
      </div>

      <div class="flow-wrap">
        <div class="flow-canvas panel"><canvas id="flowCanvas"></canvas></div>
        <aside class="flow-detail panel" id="flowDetail">
          <h2 id="dTitle">항목을 클릭하세요</h2>
          <div id="dText" class="dtext muted">· 박스를 끌어서 원하는 위치에 놓으세요<br>· [🔗 연결 그리기] 로 항목끼리 화살표를 잇습니다<br>· 박스를 더블클릭하면 내용을 고칠 수 있습니다</div>
          <div class="drow"><span id="dFolder" class="muted small"></span><a id="dOpen" class="btn small" hidden>📁 자료방에서 열기</a></div>
          <h3>관련 자료</h3>
          <div class="tbl-wrap"><table class="tbl small" id="dFiles"><thead><tr><th>이름</th><th>종류</th><th class="r">크기</th><th>수정한 날짜</th></tr></thead><tbody></tbody></table></div>
          <h3>이 단계 진행중 안건</h3>
          <div class="tbl-wrap"><table class="tbl small" id="dDeals"><thead><tr><th>관리번호</th><th>고객사</th><th>모델</th><th>다음 기한</th></tr></thead><tbody></tbody></table></div>
        </aside>
      </div>

      <!-- 항목 편집 창 -->
      <div id="nodeModal" class="modal" hidden>
        <div class="modal-box">
          <h2 id="mTitle">플로우 항목</h2>
          <input type="hidden" id="mId">
          <div class="fields">
            <div class="row"><label>항목 이름</label><input id="mName" class="inp wide"></div>
            <div class="row"><label>저장소 (안내문)</label><input id="mStore" class="inp wide"></div>
            <div class="row"><label>설명</label><textarea id="mDesc" class="inp wide" rows="4"></textarea></div>
            <div class="row"><label>체크포인트</label><textarea id="mTip" class="inp wide" rows="2"></textarea></div>
            <div class="row"><label>도형 / 색</label><span class="inline">
              <select id="mShape" class="inp"><option value="box">사각형 (작업)</option><option value="oval">타원 (시작·종료)</option><option value="diamond">마름모 (판단)</option></select>
              <select id="mColor" class="inp"><option value="">자동(단계색)</option><option value="#0F62FE">파랑</option><option value="#5B4FCF">보라</option><option value="#D9820B">주황</option><option value="#1E8E4E">초록</option><option value="#0E7C86">청록</option><option value="#D02F35">빨강</option><option value="#5A6B7D">회색</option></select></span></div>
            <div class="row"><label>자료방 폴더</label><input id="mFolder" class="inp wide" placeholder="비우면 연결 단계의 기본 폴더"></div>
            <div class="row"><label>연결 단계</label><select id="mStage" class="inp"><option value="-1">(연결 안 함)</option>
              <option th:each="s : ${stages}" th:value="${s.no()}" th:text="${s.no()} + '. ' + ${s.name()}"></option></select></div>
          </div>
          <div class="nav-row"><button class="btn" id="mCancel">취소</button><span class="spacer"></span><button class="btn primary" id="mSave">저장</button></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/flow.js"></script>
</body>
</html>
