<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('설정 · 기준정보')}"></head>
<body>
<div class="app">
  <aside th:replace="~{layout :: sidebar}"></aside>
  <div class="main">
    <header th:replace="~{layout :: topbar('설정 · 기준정보')}"></header>
    <main class="content">
      <div th:replace="~{layout :: flash}"></div>

      <div class="grid2">
        <section class="panel">
          <h2>거래처</h2>
          <p class="muted small">모든 모듈이 같은 코드를 씁니다. 이름 대신 코드로 연결되므로 코드는 바꾸지 마세요.</p>
          <div class="tbl-wrap">
            <table class="tbl small">
              <thead><tr><th>코드</th><th>이름</th><th>약칭</th><th>구분</th><th></th></tr></thead>
              <tbody>
                <tr th:each="c : ${companies}">
                  <td class="mono" th:text="${c.code}"></td><td th:text="${c.name}"></td><td th:text="${c.shortName}"></td><td th:text="${c.kind}"></td>
                  <td><form method="post" action="/settings/company/delete" data-confirm="삭제할까요? 안건에서 사용 중이면 삭제되지 않습니다."><input type="hidden" name="code" th:value="${c.code}"><button class="btn small">삭제</button></form></td>
                </tr>
              </tbody>
            </table>
          </div>
          <form method="post" action="/settings/company" class="toolbar">
            <input name="code" class="inp w80" placeholder="코드" required>
            <input name="name" class="inp w180" placeholder="이름" required>
            <input name="shortName" class="inp w80" placeholder="약칭">
            <select name="kind" class="inp"><option th:each="k : ${kinds}" th:value="${k}" th:text="${k}"></option></select>
            <button class="btn primary">추가 / 수정</button>
          </form>
        </section>

        <section class="panel">
          <h2>신용장 기한 규칙 (고객사별)</h2>
          <p class="muted small">여기에 없는 고객사는 아래 기본값이 적용됩니다. 기본은 +2주/+4주이며, 고객사별로 다르게 둘 수 있습니다.</p>
          <div class="tbl-wrap">
            <table class="tbl small">
              <thead><tr><th>고객사</th><th class="c">Latest shipment</th><th class="c">Expiry date</th><th></th></tr></thead>
              <tbody>
                <tr th:each="r : ${lcRules}">
                  <td><span class="mono" th:text="${r.companyCode}"></span> <span th:text="${nameMap.get(r.companyCode)}"></span></td>
                  <td class="c" th:text="'+' + ${r.shipDays} + '일'"></td><td class="c" th:text="'+' + ${r.expiryDays} + '일'"></td>
                  <td><form method="post" action="/settings/lcrule/delete"><input type="hidden" name="companyCode" th:value="${r.companyCode}"><button class="btn small">삭제</button></form></td>
                </tr>
              </tbody>
            </table>
          </div>
          <form method="post" action="/settings/lcrule" class="toolbar">
            <select name="companyCode" class="inp"><option th:each="c : ${companies}" th:if="${c.kind=='고객사'}" th:value="${c.code}" th:text="${c.name}"></option></select>
            <label>선적 +<input name="shipDays" type="number" class="inp w80" value="7" required>일</label>
            <label>만료 +<input name="expiryDays" type="number" class="inp w80" value="14" required>일</label>
            <button class="btn primary">저장</button>
          </form>

          <h2 style="margin-top:24px">기본값 · 알림 기준</h2>
          <form method="post" action="/settings/values" class="fields">
            <div class="row"><label>회사명</label><input name="company" class="inp" th:value="${values['company']}"></div>
            <div class="row"><label>기본 Latest shipment</label><span class="inline">FCA + <input name="ship_days" class="inp w80" th:value="${values['ship_days']}"> 일</span></div>
            <div class="row"><label>기본 Expiry date</label><span class="inline">FCA + <input name="expiry_days" class="inp w80" th:value="${values['expiry_days']}"> 일</span></div>
            <div class="row"><label>L/C 개설요청 기한</label><span class="inline">FCA − <input name="lc_lead" class="inp w80" th:value="${values['lc_lead']}"> 일</span></div>
            <div class="row"><label>커미션 입금 기준</label><span class="inline">청구 후 <input name="comm_due" class="inp w80" th:value="${values['comm_due']}"> 일</span></div>
            <div class="row"><label>알림 표시 범위</label><span class="inline"><input name="horizon" class="inp w80" th:value="${values['horizon']}"> 일 앞까지</span></div>
            <div class="row"><label>자료방 폴더</label><input name="archive_path" class="inp wide" th:value="${values['archive_path']}" th:placeholder="${archiveRoot}"><span class="hint">비우면 설정파일 기본값. NAS 는 //서버주소/공유폴더 형식</span></div>
            <div class="nav-row"><span class="spacer"></span><button class="btn primary">설정 저장</button></div>
          </form>
        </section>
      </div>

      <section class="panel">
        <h2>선택 목록</h2>
        <div class="grid3">
          <div th:each="cat : ${codeCats}">
            <h3 th:text="${cat}"></h3>
            <ul class="codes">
              <li th:each="v : ${codes[cat]}"><span th:text="${v}"></span>
                <form method="post" action="/settings/code/delete" style="display:inline"><input type="hidden" name="category" th:value="${cat}"><input type="hidden" name="value" th:value="${v}"><button class="x" title="삭제">×</button></form></li>
            </ul>
            <form method="post" action="/settings/code/add" class="toolbar"><input type="hidden" name="category" th:value="${cat}"><input name="value" class="inp" placeholder="추가" required><button class="btn small">추가</button></form>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
